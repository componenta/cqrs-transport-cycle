name: Verify and release

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        php: ['8.4', '8.5']
        transport: ['1.0.0', '2.0.0', '3.0.1', '4.0.0']
    steps:
      - uses: actions/checkout@v7
      - name: Checkout current transport source
        uses: actions/checkout@v7
        with:
          repository: componenta/cqrs-transport
          ref: main
          path: .ci/cqrs-transport
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Configure Composer authentication
        run: composer config --global github-oauth.github.com "${{ github.token }}"
      - run: composer validate --strict
      - name: Select transport version
        shell: bash
        run: |
          if [ "${{ matrix.transport }}" = "4.0.0" ]; then
            composer config --json repositories.componenta-cqrs-transport '{"type":"path","url":".ci/cqrs-transport","options":{"versions":{"componenta/cqrs-transport":"4.0.0"}}}'
          fi
          composer require --no-update "componenta/cqrs-transport:${{ matrix.transport }}"
      - name: Install dependency matrix
        shell: bash
        env:
          COMPOSER_MAX_PARALLEL_HTTP: 2
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep $((attempt * 20))
          done
      - run: composer test
      - run: composer analyse

  verify-minimum-database:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - name: Checkout current transport source
        uses: actions/checkout@v7
        with:
          repository: componenta/cqrs-transport
          ref: main
          path: .ci/cqrs-transport
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Configure Composer authentication
        run: composer config --global github-oauth.github.com "${{ github.token }}"
      - run: composer validate --strict
      - name: Select current transport and minimum database version
        shell: bash
        run: |
          composer config --json repositories.componenta-cqrs-transport '{"type":"path","url":".ci/cqrs-transport","options":{"versions":{"componenta/cqrs-transport":"4.0.0"}}}'
          composer require --no-update componenta/cqrs-transport:4.0.0 cycle/database:2.21.0
      - name: Install dependencies
        run: composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - run: composer test
      - run: composer analyse

  publish:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v')
    needs: [verify, verify-minimum-database]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          first_line="${COMMIT_MESSAGE%%$'\n'*}"
          tag="${first_line#Release }"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
